name: Windows build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Kronix.sln

      - name: Check NuGet advisories
        shell: pwsh
        run: |
          $audit = dotnet list Kronix.csproj package --vulnerable --include-transitive | Out-String
          Write-Host $audit
          if ($LASTEXITCODE -ne 0) {
            throw "NuGet vulnerability audit failed."
          }
          if ($audit -match "has the following vulnerable packages") {
            throw "A vulnerable NuGet dependency was found."
          }

      - name: Run tests
        run: dotnet test Kronix.sln --configuration Debug --no-restore

      - name: Publish self-contained Windows build
        run: dotnet publish Kronix.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false --output artifacts\Kronix-win-x64

      - name: Upload publish folder
        uses: actions/upload-artifact@v4
        with:
          name: Kronix-win-x64
          path: artifacts\Kronix-win-x64\
          if-no-files-found: error
          retention-days: 14
